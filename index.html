<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>當沖雷達 Pro V0.5.2.1</title><style>body{margin:0;background:#0b1120;color:#e9effb;font:16px -apple-system,sans-serif;padding:24px 16px 110px}.card{background:#18253b;border:1px solid #30425e;border-radius:18px;padding:17px;margin:12px 0}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.green{color:#67d8af}.muted,small{color:#9aa9c3}button,select,input{background:#243752;color:white;border:1px solid #49617e;border-radius:10px;padding:10px}input{max-width:100%}nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#111d30;padding:12px}nav button{flex:1}section[hidden]{display:none}.stock{cursor:pointer}</style></head><body><header class="row"><div><h1>當沖雷達 <span class="green">Pro</span></h1><small>V0.5.2.1 · 盤後篩選 / 個人盤中查詢</small></div><span id="status">載入中</span></header><div class="card"><div id="meta"></div><div id="error"></div></div><section id="radar"><div class="row"><h2>候選股票</h2><select id="sort"><option value="score">評分排序</option><option value="volume">成交量排序</option><option value="change">漲跌幅排序</option></select></div><div id="stocks"></div></section><section id="detail" hidden><button onclick="show('radar')">返回</button><div id="detailbody"></div></section><section id="live" hidden><h2>個人盤中報價</h2><div class="card"><p class="muted">需自備富果免費會員 API Key，最多 5 檔，每 60 秒更新（僅頁面可見時）。金鑰只在此頁記憶體使用，不會寫入 GitHub。Safari 可能受 API 跨網域限制。</p><p>API Key <input id="apikey" type="password" autocomplete="off"></p><p>股票代號 <input id="symbols" value="4526,1802,6770"></p><button id="fetchlive">查詢 / 啟動更新</button> <button id="stoplive">停止</button><p id="liveinfo"></p><div id="livequotes"></div></div></section><section id="settings" hidden><h2>篩選與風控</h2><div class="card"><p>最低成交量（張） <input id="minvol" type="number" value="3000"></p><p>每筆風險（元） <input id="risk" type="number" value="1000"></p><p><label><input id="exclude" type="checkbox" checked> 排除代碼 0 開頭的 ETF／基金類標的</label></p><button id="apply">套用</button></div></section><nav><button onclick="show('radar')">雷達</button><button onclick="show('live')">盤中</button><button onclick="show('settings')">設定</button></nav><script src="./app.js?v=05211" defer></script></body></html>
