<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1120"><link rel="manifest" href="./manifest.webmanifest"><title>當沖雷達 Pro V0.5.3.2</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1120;color:#e9effb;font:16px -apple-system,BlinkMacSystemFont,sans-serif;padding:18px 14px 95px}h1{font-size:26px;margin:10px 0}h2{font-size:20px}.card{background:#18253b;border:1px solid #30425e;border-radius:16px;padding:14px;margin:12px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:9px}.muted,small{color:#a8b7d0}small{font-size:12px}.green{color:#66e0ae}.red{color:#ff9797}.amber{color:#f5cb79}.pill{border:1px solid #6a5260;background:#4a2835;border-radius:9px;padding:5px 8px;font-size:12px}.tag{display:inline-block;border:1px solid #516780;border-radius:8px;padding:2px 6px;margin:2px;font-size:11px}button,input,select,textarea{font:inherit;background:#243752;color:white;border:1px solid #49617e;border-radius:10px;padding:10px}button{cursor:pointer}button:disabled{opacity:.5}input{max-width:100%}input[type=number]{width:110px}textarea{width:100%;min-height:105px}section[hidden]{display:none}nav{position:fixed;bottom:0;left:0;right:0;display:flex;gap:5px;background:#111d30;padding:10px 8px max(10px,env(safe-area-inset-bottom));z-index:10}nav button{flex:1;font-size:13px;padding:10px 4px}.stock{cursor:pointer}.star{font-size:23px;border:0;background:transparent;color:#f4d279;padding:2px 8px}.line{border-top:1px solid #30425e;margin:10px 0;padding-top:10px}.alert{background:#352532;border:1px solid #94536b;border-radius:10px;padding:9px;margin-top:10px}.info{background:#1c3444;border-radius:10px;padding:9px;margin-top:10px}p{line-height:1.5}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.metric{background:#111d30;border-radius:10px;padding:9px}.metric small{display:block}.metric b{display:block;margin-top:5px}.controls{display:flex;gap:8px;flex-wrap:wrap}.controls button{font-size:13px}</style></head><body><header class="row"><div><h1>當沖雷達 <span class="green">Pro</span></h1><small>V0.5.3.2 · 收盤交易日驗證 / 自選分析</small></div><small id="status">載入中</small></header><div class="card"><div id="meta"></div><div id="error" class="red"></div><div id="broker-meta" class="muted"></div></div><section id="radar"><div class="row"><h2>候選股票</h2><select id="sort"><option value="score">評分排序</option><option value="volume">成交量排序</option><option value="change">漲跌幅排序</option></select></div><div id="stocks"></div></section><section id="watch" hidden><h2>★ 我的自選股</h2><div class="card"><div class="row"><input id="watchid" inputmode="numeric" placeholder="股票代號，例如 4526" style="width:70%"><button id="addwatch">加入</button></div><small>自選清單儲存於這台裝置的瀏覽器；支援原雷達清單以外的代號，但盤後資料可能沒有收錄。</small></div><div id="watchstocks"></div></section><section id="detail" hidden><button id="back">← 返回</button><div id="detailbody"></div></section><section id="live" hidden><h2>個人盤中報價</h2><div class="card"><p class="muted">自備富果 API Key，最多 5 檔，頁面可見時約每 60 秒更新。金鑰僅存本頁記憶體。</p><p>API Key <input id="apikey" type="password" autocomplete="off"></p><p>股票代號 <input id="symbols" value="4526,1802,6770"></p><div class="controls"><button id="fetchlive">查詢／啟動</button><button id="stoplive">停止</button></div><p id="liveinfo" class="muted"></p><div id="livequotes"></div></div></section><section id="settings" hidden><h2>篩選與風控</h2><div class="card"><p>最低成交量（張） <input id="minvol" type="number" value="3000"></p><p>每筆風險（元） <input id="risk" type="number" value="1000"></p><p><label><input id="exclude" type="checkbox" checked> 排除代碼 0 開頭標的</label></p><button id="apply">套用</button></div><div class="card"><h2>分點資料匯入（非日常必要操作）</h2><p class="muted">尚未接通授權自動資料來源時，首頁會顯示待更新。匯入資料格式：日期,股票代號,分點名稱,買進張數,賣出張數。</p><textarea id="csv" placeholder="日期,股票代號,分點名稱,買進張數,賣出張數"></textarea><div class="controls"><button id="import">匯入完整資料</button><button id="clearbroker">清除本機分點資料
