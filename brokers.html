<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1120"><title>V0.5.3 券商分點監控</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1120;color:#e9effb;font:16px -apple-system,BlinkMacSystemFont,sans-serif;padding:18px 14px 100px}.card{background:#18253b;border:1px solid #30425e;border-radius:15px;padding:14px;margin:12px 0}.muted,small{color:#9aa9c3}.row{display:flex;gap:9px;align-items:center;justify-content:space-between;flex-wrap:wrap}input,select,button,textarea{background:#243752;color:#fff;border:1px solid #49617e;border-radius:9px;padding:10px;font:inherit;max-width:100%}input[type=number]{width:110px}input[type=text]{width:100%}button{cursor:pointer}button:disabled{opacity:.5}.tag{display:inline-block;border:1px solid #53657c;border-radius:12px;padding:3px 7px;font-size:12px;margin:3px}.warning{color:#f6c96e}.danger{color:#ff9a9a}.good{color:#72dfb5}.group{padding:8px 0;border-bottom:1px solid #30425e}.group:last-child{border:0}nav{position:fixed;bottom:0;left:0;right:0;background:#111d30;padding:12px 12px max(12px,env(safe-area-inset-bottom));display:flex;gap:8px}nav button{flex:1}textarea{width:100%;height:125px}h1{font-size:25px}h2{font-size:20px}p{line-height:1.55}label{display:block;margin:8px 0}summary{cursor:pointer;font-weight:600}#result .card{margin:8px 0}</style></head><body><header class="row"><div><h1>券商分點監控</h1><small>V0.5.3 · 七組名單／個股籌碼警報</small></div><button onclick="location.href='./index.html'">← 返回雷達</button></header><div class="card"><b>資料狀態：<span class="warning" id="state">尚未匯入分點交易紀錄</span></b><p class="muted">券商名單不等於買賣紀錄。此頁不會自行推測分點交易；只有你匯入有日期、股票代號、分點名稱與買賣張數的資料，才會產生警報。資料僅保存在此裝置的瀏覽器中。</p></div><div class="card"><h2>監控設定</h2><label>分析股票代號<input id="stock" type="text" inputmode="numeric" placeholder="例如 4526"></label><div class="row"><label>最低淨買超（張）<input id="minbuy" type="number" min="0" value="500"></label><label>占成交量門檻（%）<input id="minratio" type="number" min="0" max="100" step="0.1" value="5"></label></div><label>股票當日總成交量（張，選填，用於比例警報）<input id="totalvol" type="number" min="0" placeholder="例如 30000"></label><button id="evaluate">分析警報</button> <button id="clear">清除匯入紀錄</button><div id="result"></div></div><div class="card"><h2>匯入實際分點交易紀錄</h2><p class="muted">每行格式：日期,股票代號,分點名稱,買進張數,賣出張數。支援 CSV 貼上，需自行確認資料來源合法與數據正確。名稱需與名單相符；不明確名稱不自動合併。</p><textarea id="csv" placeholder="2026-10-28,4526,凱基－台北,1500,300"></textarea><div class="row"><button id="import">匯入紀錄</button><button id="example">填入示範（假資料）</button></div><p id="importinfo" class="muted"></p></div><div class="card"><h2>七組券商／分點名單</h2><label>搜尋券商或分點<input id="search" type="text" placeholder="輸入券商或分點名稱"></label><div id="groups">載入名單中…</div></div><nav><button onclick="location.href='./index.html'">雷達</button><button onclick="window.scrollTo({top:0,behavior:'smooth'})">警報</button><button onclick="document.getElementById('groups').scrollIntoView({behavior:'smooth'})">名單</button></nav><script src="./brokers.js?v=0530" defer></script></body></html>
